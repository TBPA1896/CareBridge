services:
  - type: web
    name: carebridge-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: carebridge_db
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_ORIGIN
        value: https://carebridge-web-q2lp.onrender.com
      - key: SEED_DATA_ENABLED
        value: "false"
      - key: AI_ENABLED
        value: "false"

  - type: web
    name: carebridge-web
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_HOST
        value: carebridge-api-ex78.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
