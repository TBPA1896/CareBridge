    allowed-origins: ${FRONTEND_ORIGIN:http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174}
  seed:
    enabled: ${SEED_DATA_ENABLED:true}

SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:CareBridgeDemo!2026}
