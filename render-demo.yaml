services:
  - type: web
    name: carebridge-demo-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: demo
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: carebridge_demo
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_ORIGIN
        fromService:
          type: web
          name: carebridge-demo-web
          property: host
      - key: SEED_DATA_ENABLED
        value: "true"
      - key: SEED_ADMIN_PASSWORD
        generateValue: true
      - key: SEED_CLINICIAN_PASSWORD
        value: CareBridge-Demo-Doctor-2026
      - key: SEED_CLINIC_PASSWORD
        value: CareBridge-Demo-Clinic-2026
      - key: SEED_PATIENT_PASSWORD
        generateValue: true
      - key: SEED_CAREGIVER_PASSWORD
        generateValue: true
      - key: AI_ENABLED
        value: "false"

  - type: web
    name: carebridge-demo-web
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_HOST
        fromService:
          type: web
          name: carebridge-demo-api
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
